[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctbench"
version = "1.0.0"
description = "Matched-pair constant-time RTL benchmark corpus, with a reference checker and a scorer."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-FIXTURES"]
keywords = ["constant-time", "hardware", "verilog", "side-channel", "benchmark", "formal-verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# pyyaml is needed by the tests that validate .pre-commit-hooks.yaml and
# action-style manifests. It is not a runtime dependency: the package itself
# reads no YAML.
dev = ["pytest>=7.4", "ruff>=0.14,<0.15", "pyyaml>=6.0"]

[project.scripts]
ctbench = "ctbench.cli:main"

[tool.setuptools]
packages = ["ctbench"]

[tool.setuptools.package-data]
ctbench = ["fixtures/*.v", "fixtures/manifest.json", "baseline.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Pinned explicitly so `ruff check .` gives contributors the same result we get,
# rather than whatever the installed ruff version happens to default to.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PERF", "ISC", "PL"]
# PLC0415: local imports are deliberate (lazy solver import, per-test isolation).
# PERF203: the try/except in the certificate search is the search, not overhead.
# PLR0913: keyword-only builder functions legitimately take many fields.
ignore = ["PLR2004", "PLR0912", "PLR0915", "PLR0913", "E501", "PLC0415", "PERF203"]
